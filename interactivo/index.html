<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Capacind Interactivo</title>
<meta name="description" content="Participá de las actividades interactivas de Capacitación Industrial.">
<meta name="theme-color" content="#021527">
<link rel="icon" href="img/logo-oscuro.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/estilos.css">
<link rel="stylesheet" href="css/participante.css">
</head>
<body>
<div class="demo-banda" id="banda-demo" hidden>Modo demostración</div>

<header class="cab">
  <img class="logo" src="img/logo-oscuro.png" alt="Capacitación Industrial">
  <span class="cab-nombre" id="cab-nombre"></span>
</header>
<div class="cab-titulo" id="cab-titulo" hidden></div>

<main class="contenedor">
  <!-- Ingreso -->
  <section id="v-ingreso" class="vista" hidden>
    <h1>Ingresá a la actividad</h1>
    <form id="form-ingreso" class="tarjeta" autocomplete="off">
      <div class="campo">
        <label for="in-codigo">Código de la sala</label>
        <input id="in-codigo" class="entrada entrada-codigo" inputmode="numeric" pattern="[0-9 ]{6,7}" maxlength="7" placeholder="123 456" required>
      </div>
      <div class="campo">
        <label for="in-nombre">Tu nombre</label>
        <input id="in-nombre" class="entrada" maxlength="30" placeholder="Nombre y apellido" required autocomplete="name">
      </div>
      <button class="btn btn-primario btn-grande btn-bloque" id="btn-ingresar">Ingresar</button>
    </form>
  </section>

  <!-- Espera -->
  <section id="v-espera" class="vista centro" hidden>
    <div class="pulso" aria-hidden="true"></div>
    <h1 id="espera-titulo">¡Ya estás dentro!</h1>
    <p class="muted" id="espera-texto">Mirá la pantalla. La próxima pregunta aparecerá aquí automáticamente.</p>
  </section>

  <!-- Pregunta -->
  <section id="v-pregunta" class="vista" hidden>
    <div class="preg-cab">
      <span class="muted" id="preg-num"></span>
      <span class="reloj-chico" id="preg-reloj" hidden></span>
    </div>
    <h1 class="preg-texto" id="preg-texto"></h1>
    <div id="preg-cuerpo"></div>
    <button class="btn btn-primario btn-grande btn-bloque" id="btn-enviar" disabled>Enviar respuesta</button>
  </section>

  <!-- Resultado -->
  <section id="v-resultado" class="vista centro" hidden>
    <div class="icono-grande" id="res-icono"></div>
    <h1 id="res-titulo"></h1>
    <p id="res-texto" class="muted"></p>
    <div class="puntos" id="res-puntos" hidden></div>
  </section>

  <!-- Mensaje -->
  <section id="v-mensaje" class="vista centro" hidden>
    <h1 id="msg-titulo"></h1>
    <p id="msg-texto" class="muted"></p>
    <button class="btn" id="btn-otra-sala">Ingresar a otra sala</button>
  </section>
</main>

<canvas id="papelitos" aria-hidden="true"></canvas>
<script type="module" src="js/participante.js"></script>
</body>
</html>
